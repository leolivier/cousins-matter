# Creates a multiplatform image of cousins matter and push it to ghcr.io for each new release
name: Image Build & Push

on:
  push:
    paths-ignore:
      - 'user-manual/**'
      - '**/*.md'

  release:
    types: [prereleased, published]

  workflow_dispatch:

# One run per ref: the release event fires twice (prereleased + published for
# prereleases) and both runs push the same tag
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────────────────────────────────────
  # Job 1 – Lint, build test image and prepare shared artefacts
  # ──────────────────────────────────────────────────────────────────────────────
  lint-and-build:
    if: github.event_name == 'release' || github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')
    uses: ./.github/workflows/reusable-lint-and-build.yml
    with:
      registry: 'ghcr.io'
      image_name: ${{ github.repository }}
      tags_def: ${{ github.event_name == 'release' && 'type=semver,pattern={{version}}' || github.event_name == 'push' && 'type=ref,event=branch' || 'type=sha' }}
      test_tag: 'test-${{ github.sha }}'
    secrets: inherit

  # ──────────────────────────────────────────────────────────────────────────────
  # Job 2 – Test Docker Image (runs in parallel with jobs 3, 4, 5 & 6)
  # ──────────────────────────────────────────────────────────────────────────────
  test-docker-image:
    needs: lint-and-build
    uses: ./.github/workflows/reusable-test-docker-image.yml
    secrets: inherit

  # ──────────────────────────────────────────────────────────────────────────────
  # Job 3 – Test install & migration scripts (runs in parallel with jobs 2, 4, 5 & 6)
  # ──────────────────────────────────────────────────────────────────────────────
  test-install-migrate:
    needs: lint-and-build
    if: ${{ github.actor != 'dependabot[bot]' }}
    uses: ./.github/workflows/reusable-test-install.yml
    secrets: inherit

  # ──────────────────────────────────────────────────────────────────────────────
  # Job 3b – Upgrade a v2 database to v3 (runs in parallel with jobs 2, 3, 4, 5 & 6)
  # ──────────────────────────────────────────────────────────────────────────────
  test-upgrade-v2:
    needs: lint-and-build
    if: ${{ github.actor != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      V2_TAG: "2.6.1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Load test Docker image
        uses: ./.github/actions/load-docker-image

      - name: Write .env
        uses: ./.github/actions/write-test-env
        with:
          test_image_ref: ghcr.io/${{ github.repository }}:test-${{ github.sha }}

      - name: Build the v2 image (the GHCR tag is no longer pullable)
        run: |
          mkdir -p /tmp/cm-v2
          curl -fsSL https://github.com/${{ github.repository }}/archive/refs/tags/v${{ env.V2_TAG }}.tar.gz \
            | tar -xz -C /tmp/cm-v2 --strip-components=1
          docker build -t cm-v2:${{ env.V2_TAG }} /tmp/cm-v2

      - name: Prepare .env (generate secrets)
        run: python ./scripts/manage_cousins_matter.py install -e -n -d "$GITHUB_WORKSPACE"

      - name: Test v2 -> v3 upgrade
        env:
          COUSINS_MATTER_IMAGE: ghcr.io/${{ github.repository }}:test-${{ github.sha }}
          V2_IMAGE: cm-v2:${{ env.V2_TAG }}
          ENVIRONMENT: docker-test
        run: |
          docker compose down -v
          docker volume prune -f
          ./scripts/tests/test_upgrade_v2_v3.sh -g

      - name: Show docker-compose services logs on failure
        if: failure()
        uses: ./.github/actions/show-logs-on-failure
        with:
          env_file_path: ${{ github.workspace }}/.env
          containers: cousins-matter.db cousins-matter cousins-matter.qcluster

  # ──────────────────────────────────────────────────────────────────────────────
  # Job 4 – Test S3 backend (runs in parallel with jobs 2, 3, 5 & 6)
  # ──────────────────────────────────────────────────────────────────────────────
  test-s3:
    needs: lint-and-build
    if: ${{ github.actor != 'dependabot[bot]' }}
    uses: ./.github/workflows/reusable-test-docker-image.yml
    with:
      s3: true
    secrets: inherit

  # ──────────────────────────────────────────────────────────────────────────────
  # Job 5 – Test multi-tenant mode (runs in parallel with jobs 2, 3, 4 & 6)
  # ──────────────────────────────────────────────────────────────────────────────
  test-multi-tenant:
    needs: lint-and-build
    if: ${{ github.actor != 'dependabot[bot]' }}
    uses: ./.github/workflows/reusable-test-docker-image.yml
    with:
      multi_tenant: true
    secrets: inherit

  # ──────────────────────────────────────────────────────────────────────────────
  # Job 6 – Test UI (runs in parallel with jobs 2, 3, 4 & 5)
  # ──────────────────────────────────────────────────────────────────────────────
  test-ui:
    needs: lint-and-build
    if: ${{ github.actor != 'dependabot[bot]' }}
    uses: ./.github/workflows/reusable-test-docker-image.yml
    with:
      ui: true
    secrets: inherit

  # ──────────────────────────────────────────────────────────────────────────────
  # Job 7 – Final multiplatform build & push (waits for jobs 2, 3, 4, 5 & 6)
  # ──────────────────────────────────────────────────────────────────────────────
  build-and-push:
    needs: [test-docker-image, test-install-migrate, test-upgrade-v2, test-s3, test-multi-tenant, test-ui]
    if: ${{ github.actor != 'dependabot[bot]' }}
    uses: ./.github/workflows/reusable-build-and-push.yml
    with:
      registry: 'ghcr.io'
      image_name: ${{ github.repository }}
      platforms: 'linux/amd64,linux/arm64'
      push: ${{ github.event_name == 'release' || github.event_name == 'push' }}
      tags_def: ${{ github.event_name == 'release' && 'type=semver,pattern={{version}}' || github.event_name == 'push' && 'type=ref,event=branch' || 'type=sha' }}
    secrets: inherit

  # ──────────────────────────────────────────────────────────────────────────────
  # Job 8 – Verify production image starts correctly (waits for job 7)
  # RUNS ONLY FOR RELEASES
  # ──────────────────────────────────────────────────────────────────────────────
  verify-production-image:
    needs: build-and-push
    if: ${{ github.event_name == 'release' }}
    uses: ./.github/workflows/reusable-verify-production-image.yml
    with:
      registry: 'ghcr.io'
      image_name: ${{ github.repository }}
    secrets: inherit
