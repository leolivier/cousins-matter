# Reusable workflow to verify the production Docker image starts correctly.
name: Reusable Verify Production Image

on:
  workflow_call:
    inputs:
      registry:
        required: true
        type: string
      image_name:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Release tag to verify (with or without leading v)'
        required: false
        default: '3.0.0-rc1'
        type: string

jobs:
  verify-production-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Determine version
        id: get_version
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            RAW="${{ inputs.image_tag }}"
          elif [[ "${{ github.event_name }}" == 'release' ]]; then
            RAW="${{ github.event.release.tag_name }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            RAW="${GITHUB_REF#refs/tags/}"
          else
            RAW="$(git describe --tags --abbrev=0)+$(git rev-parse --short HEAD)"
          fi
          REGISTRY="${{ inputs.registry || 'ghcr.io' }}"
          IMAGE_NAME="${{ inputs.image_name || github.repository }}"
          # VERSION is the git tag (leading v); the image tag drops it
          [[ "${RAW}" == v* ]] || RAW="v${RAW}"
          echo "VERSION=${RAW}" >> $GITHUB_OUTPUT
          echo "IMAGE=${REGISTRY}/${IMAGE_NAME}:${RAW#v}" >> $GITHUB_OUTPUT

      - name: Get minimum files
        run: |
          curl -LO https://raw.githubusercontent.com/${{ github.actor }}/cousins-matter/refs/tags/${{ steps.get_version.outputs.VERSION }}/scripts/manage_cousins_matter.py
          python manage_cousins_matter.py install -d cm_test_install -r ${{ steps.get_version.outputs.VERSION }} -n

      # One-run diagnostic: authenticated pull vs anonymous pull on the runner.
      # The package is public, so the workflow never pushes and works anonymously;
      # if even the anonymous pull fails here, the problem is GHCR/CDN infra.
      - name: Diagnostic pull (auth vs anonymous)
        run: |
          docker version
          docker info | grep -iE "storage|snapshotter" || true
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ${{ inputs.registry || 'ghcr.io' }} -u ${{ github.actor }} --password-stdin
          echo "--- authenticated pull ---"
          docker pull ${{ steps.get_version.outputs.IMAGE }} 2>&1 | tail -5 || true
          echo "--- anonymous pull after logout ---"
          docker logout ${{ inputs.registry || 'ghcr.io' }} || true
          docker pull ${{ steps.get_version.outputs.IMAGE }}

      - name: Update .env for production test
        run: |
          sed -i -e 's/^ADMIN=.*/ADMIN=admin/' cm_test_install/.env
          sed -i -e 's/^ADMIN_PASSWORD=.*/ADMIN_PASSWORD=admin/' cm_test_install/.env
          sed -i -e 's/^ADMIN_EMAIL=.*/ADMIN_EMAIL=admin@example.com/' cm_test_install/.env
          sed -i -e 's/^ADMIN_BIRTHDATE=.*/ADMIN_BIRTHDATE=2000-01-01/' cm_test_install/.env
          sed -i -e 's/^ADMIN_FIRSTNAME=.*/ADMIN_FIRSTNAME=Admin/' cm_test_install/.env
          sed -i -e 's/^ADMIN_LASTNAME=.*/ADMIN_LASTNAME=User/' cm_test_install/.env
          sed -i -e 's/^SITE_DOMAIN=.*/SITE_DOMAIN=localhost/' cm_test_install/.env
          sed -i -e 's/^SITE_NAME=.*/SITE_NAME=Production Test Site/' cm_test_install/.env
          sed -i -e 's/^ALLOWED_HOSTS=.*/ALLOWED_HOSTS=127.0.0.1,localhost/' cm_test_install/.env
          sed -i -e 's/^LANGUAGE_CODE=.*/LANGUAGE_CODE=en/' cm_test_install/.env
          sed -i -e 's/^EMAIL_HOST=.*/EMAIL_HOST=smtp.gmail.com/' cm_test_install/.env
          sed -i -e 's/^EMAIL_PORT=.*/EMAIL_PORT=465/' cm_test_install/.env
          sed -i -e 's/^EMAIL_HOST_USER=.*/EMAIL_HOST_USER=test@example.com/' cm_test_install/.env
          sed -i -e 's/^EMAIL_HOST_PASSWORD=.*/EMAIL_HOST_PASSWORD=test-password/' cm_test_install/.env
          sed -i -e 's/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=test-postgres-password/' cm_test_install/.env
          sed -i -e 's/^Q_SYNC=.*/Q_SYNC=True/' cm_test_install/.env
          sed -i -e 's/^ENVIRONMENT=.*/ENVIRONMENT=production/' cm_test_install/.env
          # leading \n: .env templates may lack a trailing newline, which would
          # glue this line into the previous (commented) one — see run 36330816976
          printf '\nCOUSINS_MATTER_IMAGE=%s\n' "${{ steps.get_version.outputs.IMAGE }}" >> cm_test_install/.env

      - name: Starts the production environment
        run: |
          cd cm_test_install

          docker compose version
          echo "=== images resolved by compose (must show 3.0.0-rc1, not latest) ==="
          grep COUSINS_MATTER_IMAGE .env
          docker compose -f docker-compose.yml --env-file .env config | grep -E "image:"

          # Bounded retries absorb transient GHCR/CDN hiccups (incl. concurrent
          # pushes of the same tag by overlapping runs)
          PULL_RETRIES=5
          for i in $(seq 1 $PULL_RETRIES); do
            docker compose -f docker-compose.yml --env-file .env pull && break
            [ "$i" -eq "$PULL_RETRIES" ] && { echo "ERROR: pull failed after $PULL_RETRIES attempts"; exit 1; }
            echo "Pull failed, retry $i/$PULL_RETRIES"; sleep 20
          done

          # Start services with production environment.
          # 300s covers start_period 15s + 3x30s healthcheck + first-install migrations.
          docker compose -f docker-compose.yml --env-file .env up -d --wait --wait-timeout 300

          # Check that the main container is running
          if ! docker ps | grep -q cousins-matter; then
            echo "ERROR: cousins-matter container is not running"
            exit 1
          fi

          # Check that the container is healthy
          HEALTH_STATUS=$(docker inspect --format='{{.State.Health.Status}}' cousins-matter)
          if [ "$HEALTH_STATUS" != "healthy" ]; then
            echo "ERROR: cousins-matter container is not healthy (status: $HEALTH_STATUS)"
            exit 1
          fi

          # Test that the application responds
          MAX_RETRIES=10
          RETRY_COUNT=0
          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            if curl -f -s http://localhost:8000/ > /dev/null; then
              echo "SUCCESS: Application is responding correctly"
              exit 0
            fi
            echo "Waiting for application to respond... (attempt $((RETRY_COUNT + 1))/$MAX_RETRIES)"
            sleep 5
            RETRY_COUNT=$((RETRY_COUNT + 1))
          done

          echo "ERROR: Application did not respond after $MAX_RETRIES attempts"
          exit 1

      - name: Checkout
        uses: actions/checkout@v7
        if: failure()
        with:
          fetch-depth: 0  # Required to get all tags
          lfs: true

      - name: Show docker-compose services logs on failure
        if: failure()
        uses: ./.github/actions/show-logs-on-failure
        with:
          env_file_path: cm_test_install/.env
          containers: cousins-matter cousins-matter.qcluster cousins-matter.db cousins-matter.redis cousins-matter.nginx

      - name: Cleanup
        if: always()
        run: |
          cd cm_test_install || true
          docker compose -f docker-compose.yml down -v || true
          docker volume prune -f
