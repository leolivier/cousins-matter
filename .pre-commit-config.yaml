# Git hooks, versioned. Activate once per clone:
#   make install-hooks      (runs `pre-commit install`)
#
# Hooks run in pre-commit-managed, isolated envs pinned by `rev` below, so the
# tool versions are reproducible and independent of the project venv (no more
# ./.venv vs ./venv path drift).
minimum_pre_commit_version: '4.0.0'
repos:

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.4
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        args: [-c, pyproject.toml]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^graphify-out/|^core/static/core/vendor/
      - id: end-of-file-fixer
        exclude: ^graphify-out/|^core/static/core/vendor/
      - id: check-yaml
      - id: check-json
        exclude: ^\.vscode/|^graphify-out/
      - id: check-toml
      - id: check-added-large-files
        args: ['--maxkb=500']
        exclude: ^graphify-out/
      - id: check-merge-conflict
      - id: detect-private-key
      - id: no-commit-to-branch
        args: ['--branch', 'main']

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
        args: [-x]
