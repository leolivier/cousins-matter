name: ${CONTAINER_NAME:-cousins-matter}   # nom du projet Compose (optionnel)

services:
  cousins-matter:
    image: ${COUSINS_MATTER_IMAGE:-ghcr.io/leolivier/cousins-matter:latest}
    container_name: ${CONTAINER_NAME:-cousins-matter}
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
      - qcluster
    networks:
      - cousins_matter_network
    ports:
      - "9005:9001"
    user: "cm_user:cm_user"
    volumes:
      - ./media:/app/media
      - ./static:/app/static
      - ./.env:/app/.env
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-production}
    healthcheck:
      test: [ "CMD-SHELL", "python /app/scripts/healthcheck.py" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  qcluster:
    image: ${COUSINS_MATTER_IMAGE:-ghcr.io/leolivier/cousins-matter:latest}
    container_name: ${CONTAINER_NAME:-cousins-matter}.qcluster
    command: [ "python", "manage.py", "qcluster" ]
    user: "cm_user:cm_user"
    restart: unless-stopped
    depends_on:
      - redis
      - postgres
    networks:
      - cousins_matter_network
    volumes:
      - ./media:/app/media
      - ./static:/app/static
      - ./.env:/app/.env
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-production}

  # Daily database dump, uploaded to R2 when BACKUP_S3_* is configured (see
  # core/management/commands/backup_database.py). It uses the app image, which
  # ships a pg_dump matching the PostgreSQL server major version.
  backup:
    image: ${COUSINS_MATTER_IMAGE:-ghcr.io/leolivier/cousins-matter:latest}
    container_name: ${CONTAINER_NAME:-cousins-matter}.backup
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    user: "cm_user:cm_user"
    entrypoint: ["/bin/sh", "-c", "while true; do python manage.py backup_database || echo 'database backup failed'; sleep 24h; done"]
    command: []  # do not append the image's default daphne command
    volumes:
      - ./backup:/app/backup
      - ./.env:/app/.env
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-production}
    networks:
      - cousins_matter_network

  postgres:
    image: postgres:18.2-alpine
    container_name: ${CONTAINER_NAME:-cousins-matter}.db
    restart: unless-stopped
    user: "postgres:postgres"
    # No published port: only the compose network may reach the database.
    volumes:
      - cousins_matter_postgres_data:/var/lib/postgresql
      - ./backup:/backup
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cousinsmatter}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-cousinsmatter}
    networks:
      - cousins_matter_network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cousinsmatter}" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  redis:
    image: redis:alpine
    container_name: ${CONTAINER_NAME:-cousins-matter}.redis
    restart: unless-stopped
    # No published port: the broker/cache must never be reachable from the host
    # network or the internet (it has no password).
    volumes:
      - cousins_matter_redis_data:/data
    networks:
      - cousins_matter_network
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  nginx:
    image: nginx:stable-alpine
    container_name: ${CONTAINER_NAME:-cousins-matter}.nginx
    ports:
      - "8000:80"
    volumes:
      - ./config/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./config/nginx/nginx.d:/var/www/html:ro
      - ./static:/app/static:ro
      - ./media:/app/media:ro
    restart: unless-stopped
    networks:
      - cousins_matter_network

networks:
  cousins_matter_network:
    name: ${CONTAINER_NAME:-cousins_matter}_network
    driver: bridge

volumes:
  cousins_matter_postgres_data:
    name: ${CONTAINER_NAME:-cousins_matter}_postgres_data
  cousins_matter_redis_data:
    name: ${CONTAINER_NAME:-cousins_matter}_redis_data
