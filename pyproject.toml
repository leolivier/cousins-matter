[project]
name = "cousins-matter"
version = "2.4.1"
description = "A family social network"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "av>=17.1",
    "blessed>=1.44",
    "channels~=4.3.2",
    "channels-redis~=4.3.0",
    "crispy-bulma~=0.12.0",
    "daphne~=4.2.2",
    "django>=6.0.7,<6.2.0",
    "django-allauth[socialaccount]>=65.18,<65.20",
    "django-cors-headers~=4.9.0",
    "django-crispy-forms~=2.6",
    "django-email-validation~=2.1.1",
    "django-environ~=0.14.0",
    "django-htmx>=1.27",
    "django-ipware~=7.0.1",
    "django-q2>=1.10,<1.12",
    "django-simple-captcha>=0.6.3,<0.8.0",
    "django-storages[dropbox,s3]~=1.14.6",
    "fpdf~=1.7.2",
    "packaging~=26.2",
    "pillow>=12.2",
    "psycopg-pool~=3.3.1",
    "psycopg[binary]~=3.3.4",
    "python-gedcom~=1.1.0",
    "requests~=2.34.2",
    "whitenoise~=6.12.0",
]

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "coverage>=7.14.3",
    "css-html-js-minify>=2.5.5",
    "django-debug-toolbar>=7.0,<7.2",
    "factory-boy~=3.3.3",
    "mypy==2.3.1",
    "pip-audit>=2.10.1",
    "playwright>=1.61.0",
    "pre-commit>=4.6.1",
    "ruff>=0.15.20",
    "types-requests>=2.33.0.20260518",
]
ai = [
    "headroom-ai[code,mcp,memory,proxy,ml]>=0.32.0",
]
[tool.bandit]
exclude_dirs = [".venv", "tests", "__pycache__", ".git", "static", "media", "user-manual"]

[tool.ruff]
# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "user-manual",
    "migrations",
    "node_modules",
    "site-packages",
    "venv",
]

# Same as Black.
line-length = 127
indent-width = 2

fix = true
force-exclude = true
preview = true

# Assume Python 3.14
target-version = "py312"

[tool.ruff.lint]
# Enable Pyflakes (`F`) and a subset of the pycodestyle (`E`) codes by default.
# Unlike Flake8, Ruff doesn't enable pycodestyle warnings (`W`) or
# McCabe complexity (`C901`) by default.
select = ["E", "F", "W", "C901"]
ignore = ["E111", "E114", "F405"]

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.mccabe]
# Flag errors (`C901`) whenever the complexity level exceeds 5.
max-complexity = 10

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

# Enable auto-formatting of code examples in docstrings.
docstring-code-format = false

# Set the line length limit used when formatting code snippets in
# docstrings (only has an effect when `docstring-code-format` is enabled).
docstring-code-line-length = "dynamic"

[tool.pyright]
typeCheckingMode = "off"
