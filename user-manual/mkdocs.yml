site_name: "Cousins Matter"
site_url: "https://cousins-matter.readthedocs.io/"
site_description: "Documentation of the CousinsMatter application"
site_author: "Olivier LEVILLAIN"
repo_url: "https://github.com/leolivier/cousins-matter"
repo_name: "GitHub"
edit_uri: "/blob/main/user-manual/"
site_dir: "site"
docs_dir: "user-manual"
use_directory_urls: true

theme:
  name: "readthedocs"
  logo: "assets/cousinades.webp"
  favicon: "assets/favicon.jpg"
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
  features:
    - navigation.instant
    - navigation.sections
    - navigation.tabs
    - toc.integrate

nav:
  - Home: index.md
  - Features: features.md
  - Installation: installation.md
  - Migrate from Version 1 to Version 2: migrate-from-v1-to-v2.md
  - Customization: customizing.md
  - Multi-tenancy: multi-tenancy.md
  - Reverse Proxying: reverse-proxying.md
  - Settings: settings.md
  - Translations: translations.md
  - Other management operations: other-management-operations.md
  - Media Storage Management: media-storage.md
  # - FAQ: faq.md
  - Technical Status: app-technical-status.md

plugins:
  - search
  - i18n:
       docs_structure: suffix   # ou "folder"
       languages:
         - locale: en
           default: true
           name: English
           build: true
         - locale: fr
           name: Français
           build: true
         # - locale: es
         #   name: Español
         #   build: true
         # - locale: it
         #   name: Italiano
         #   build: true
         # - locale: de
         #   name: Deutsch
         #   build: true
         # - locale: pt
         #   name: Português
         #   build: true

markdown_extensions:
  - admonition
  # - codehilite
  - toc:
      permalink: true
  - footnotes
  - attr_list
  # - pymdownx.superfences
  # - pymdownx.highlight
  # - pymdownx.inlinehilite
  # - pymdownx.details
  # - pymdownx.progressbar
  # - pymdownx.betterem:
  #     smart_enable: all

extra_css:
  - "assets/css/extra.css"

#extra_javascript:
#  - "assets/js/extra.js"      # optionnel

extra:
  social:
    - icon: fontawesome/brands/github
      link: "https://github.com/leolivier/cousins-matter"

# Optional deployment settings for Netlify / GitHub Pages omitted
